name: Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          # Ambil tag terakhir atau mulai dari v0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Parse versi
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $LATEST_TAG → $NEW_VERSION"

      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Fetch Zygisk header
        run: |
          curl -fsSL -o jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Placeholder resetprop-rs
        run: |
          mkdir -p prebuilt
          echo "# placeholder" > prebuilt/resetprop-rs.README

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.sha256

      - name: Create Release Notes
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          echo "## Release $NEW_VERSION" > release_notes.md
          echo "**Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md
          echo "**Commit:** ${{ github.sha }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Artifacts" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cd dist && sha256sum *.zip >> ../release_notes.md && cd ..
          echo "\`\`\`" >> release_notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ternak-tt-zip
          path: dist/*.zip

      - name: Create Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          files: |
            dist/*.zip
            dist/checksums.sha256
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
