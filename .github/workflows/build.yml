name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force a specific version (e.g. v1.0.30). Leave blank to auto-bump.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Host verification suites
        # Pins the deterministic core both layers build on, and executes the
        # real per-fd synth state machine from jni/module_hooks.cpp against the
        # runner's own /proc files. Runs outside the release job: a host
        # environment quirk must not be able to block a release.
        run: |
          if command -v clang++ >/dev/null 2>&1; then
            bash tests/host/run.sh
          else
            CXX=g++ bash tests/host/run.sh
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: LSPosed rewriter unit test
        # The register-body rewriter is the load-bearing piece of the LSPosed
        # variant — the wire form it patches is what makes TikTok's register
        # endpoint mint a new did. It has no Android dependency, so it is
        # pinned here on a plain JDK: a regression in it would otherwise reach
        # a device with no test of any kind. See
        # lsp/app/src/test/java/id/sandboxid/tt/RewriteTest3.java.
        run: |
          set -eu
          mkdir -p out/id/sandboxid/tt
          # android.util.Log is the only Android dependency; stub it so the
          # test compiles without an SDK. The two stubbed lines are inert.
          sed -e 's/import android.util.Log;/\/\/ stubbed/' \
              -e 's/Log\.d(TAG, "register body patched");/\/\/ stubbed/' \
              lsp/app/src/main/java/id/sandboxid/tt/Rewrite.java \
              > out/id/sandboxid/tt/Rewrite.java
          cp lsp/app/src/test/java/id/sandboxid/tt/RewriteTest3.java out/
          javac -d out out/id/sandboxid/tt/Rewrite.java out/RewriteTest3.java
          java -cp out id.sandboxid.tt.RewriteTest3 | tee test.log
          grep -q 'ALL PASS' test.log

      - name: Shell lint (syntax + shellcheck)
        run: |
          set -eu
          echo '----- syntax check (bash -n for bash scripts, sh -n for the rest) -----'
          for f in $(git ls-files '*.sh'); do
            if head -1 "$f" | grep -q bash; then
              bash -n "$f" && echo "bash -n OK : $f"
            else
              sh   -n "$f" && echo "sh -n   OK : $f"
            fi
          done
          echo '----- shellcheck (severity>=warning, honouring each shebang) -----'
          shellcheck --version | head -2
          shellcheck -S warning $(git ls-files '*.sh')
          echo 'shell lint: clean'

      - name: Fetch all tags
        run: |
          git fetch --tags --force --prune
          echo 'existing tags:'
          git tag --sort=-v:refname | head -10

      - name: Resolve version (loop-safe auto-bump)
        id: version
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          set -eu
          PROP_VERSION=$(grep '^version=' module.prop | head -n 1 | cut -d= -f2-)
          PROP_CODE=$(grep '^versionCode=' module.prop | head -n 1 | cut -d= -f2-)

          if [ -z "$PROP_VERSION" ]; then
            echo "::error::module.prop has no version= line"
            exit 1
          fi
          if ! printf '%s' "$PROP_CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::module.prop versionCode='$PROP_CODE' is not a number"
            exit 1
          fi
          FORCE="$FORCE_VERSION"

          if [ -n "$FORCE" ] && ! printf '%s' "$FORCE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::force_version '$FORCE' invalid; expected vMAJOR.MINOR.PATCH (mis. v1.0.30)"
            exit 1
          fi

          HIGHEST=$(git tag --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | head -1 || true)
          [ -z "$HIGHEST" ] && HIGHEST="v0.0.0"

          # The versionCode the latest release shipped, carried in that tag's own
          # annotation so the counter survives a sync commit that failed to land:
          # a stale committed module.prop would otherwise drag versionCode below
          # a released value and the update channel is monotonic or nothing.
          # Tags created before the annotation carried a code have none, and the
          # empty fallback below keeps them working. The format the tag is
          # written in and the format read back here must stay in step — the
          # "Create tag if missing" step writes "(code <N>)".
          PREV_CODE=""
          if [ "$HIGHEST" != "v0.0.0" ]; then
            PREV_CODE=$(git tag -l --format='%(contents:subject)' "$HIGHEST" 2>/dev/null \
                          | grep -oE 'code [0-9]+' | head -1 | cut -d' ' -f2 || true)
          fi

          higher() {
            printf '%s\n%s\n' "$1" "$2" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1.2,1n -k2,2n -k3,3n \
              | tail -1
          }

          if [ -n "$FORCE" ]; then
            BASE="$FORCE"
          else
            BASE=$(higher "$PROP_VERSION" "$HIGHEST")
          fi

          NEW_VERSION="$BASE"
          BUMPS=0
          while git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; do
            V=${NEW_VERSION#v}
            MAJ=$(printf '%s' "$V" | cut -d. -f1)
            MIN=$(printf '%s' "$V" | cut -d. -f2)
            PAT=$(printf '%s' "$V" | cut -d. -f3)
            [ -z "$PAT" ] && PAT=0
            NEW_VERSION="v${MAJ}.${MIN}.$((PAT + 1))"
            BUMPS=$((BUMPS + 1))
            if [ "$BUMPS" -gt 500 ]; then
              echo "::error::Bumped >500 times without finding a free tag. Aborting."
              exit 1
            fi
          done

          # Never below a code an earlier release already shipped.
          CODE_FLOOR="$PROP_CODE"
          if printf '%s' "$PREV_CODE" | grep -Eq '^[0-9]+$' && [ "$PREV_CODE" -gt "$CODE_FLOOR" ]; then
            CODE_FLOOR="$PREV_CODE"
          fi
          NEW_CODE=$((CODE_FLOOR + BUMPS))

          if [ -n "$FORCE" ] && [ "$HIGHEST" != "v0.0.0" ] && [ "$FORCE" != "$HIGHEST" ] \
             && [ "$(higher "$FORCE" "$HIGHEST")" = "$HIGHEST" ]; then
            echo "::warning::forced version $FORCE is lower than the latest tag $HIGHEST; versionCode is still raised to ${NEW_CODE} so the update channel stays monotonic."
          fi

          PREV_TAG=$(git tag --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -v "^${NEW_VERSION}$" \
                    | head -1 || true)

          {
            echo "new_version=${NEW_VERSION}"
            echo "new_code=${NEW_CODE}"
            echo "prev_tag=${PREV_TAG}"
            echo "bumps=${BUMPS}"
          } >> "$GITHUB_OUTPUT"

          echo "----- version resolution -----"
          echo "module.prop   : ${PROP_VERSION} (code=${PROP_CODE})"
          echo "latest tag    : ${HIGHEST} (code=${PREV_CODE:-<none>})"
          echo "code floor    : ${CODE_FLOOR}"
          echo "base          : ${BASE}"
          echo "bumps needed  : ${BUMPS}"
          echo "resolved      : ${NEW_VERSION} (code=${NEW_CODE})"
          echo "prev tag      : ${PREV_TAG:-<none>}"

      - name: Sync module.prop
        env:
          NV: ${{ steps.version.outputs.new_version }}
          NC: ${{ steps.version.outputs.new_code }}
        run: |
          set -eu
          sed -i "s|^version=.*|version=${NV}|" module.prop
          sed -i "s|^versionCode=.*|versionCode=${NC}|" module.prop
          echo '----- module.prop after sync -----'
          cat module.prop

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r26d

      - name: Build (release + debug)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VARIANT: both
        run: |
          chmod +x build.sh
          ./build.sh

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256

      - name: Verify packages
        # The zip is the only thing a user installs, and the module.prop inside
        # it is the only thing the update channel sees. Both are checked rather
        # than trusted — in particular the per-variant update channel, which is
        # what keeps a debug install from silently becoming a release install.
        env:
          NV: ${{ steps.version.outputs.new_version }}
          NC: ${{ steps.version.outputs.new_code }}
        run: |
          set -eu
          NV="$NV" NC="$NC" ./tools/verify_packages.sh

      - name: Generate update channels
        # Two channels, because there are two variants and update.json can name
        # only one zip. Each variant's package reads its own channel (rewritten
        # by build.sh), so an update installs the same variant the device already
        # runs instead of flipping it.
        env:
          NV: ${{ steps.version.outputs.new_version }}
          NC: ${{ steps.version.outputs.new_code }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          BASE="https://github.com/${REPO}/releases/download/${NV}"
          CHANGELOG="https://raw.githubusercontent.com/${REPO}/main/CHANGELOG.md"

          cat > update.json <<EOF
          {
            "version": "${NV}",
            "versionCode": ${NC},
            "zipUrl": "${BASE}/sandboxid-${NV}-release.zip",
            "changelog": "${CHANGELOG}"
          }
          EOF
          cat > update.debug.json <<EOF
          {
            "version": "${NV}",
            "versionCode": ${NC},
            "zipUrl": "${BASE}/sandboxid-${NV}-debug.zip",
            "changelog": "${CHANGELOG}"
          }
          EOF

          echo '----- update.json (release channel) -----'
          cat update.json
          echo '----- update.debug.json (debug channel) -----'
          cat update.debug.json

      - name: Promote CHANGELOG.md Unreleased section
        # Keeps the release notes self-maintaining: prose is written under
        # ## Unreleased while working, and the release promotes it to a versioned
        # section with no manual changelog edit. Validates before it writes, and
        # leaves the file alone when the section is empty.
        env:
          NV: ${{ steps.version.outputs.new_version }}
        run: |
          set -eu
          NV="$NV" ./tools/promote_changelog.sh
          echo '----- CHANGELOG.md promotion (empty diff = nothing to promote) -----'
          git diff --stat CHANGELOG.md || true

      - name: Generate release notes
        env:
          NV: ${{ steps.version.outputs.new_version }}
          NC: ${{ steps.version.outputs.new_code }}
          PREV: ${{ steps.version.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          NV="$NV" NC="$NC" PREV="$PREV" REPO="$REPO" \
            OUT=release_notes.md ./tools/gen_release_notes.sh
          echo '----- release_notes.md -----'
          cat release_notes.md

      - name: Commit synced files (rebase-safe)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json update.debug.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): sync ${{ steps.version.outputs.new_version }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "push ok (attempt $i)"
              exit 0
            fi
            echo "push attempt $i failed, rebasing..."
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep 3
          done
          echo "::warning::Failed to push the release sync after 5 attempts."
          exit 0

      - name: Create tag if missing
        env:
          NV: ${{ steps.version.outputs.new_version }}
          NC: ${{ steps.version.outputs.new_code }}
        run: |
          set -eu
          # The identity is needed by `git tag -a` below. It is normally set by
          # the "Commit synced files" step, but that step only runs on main, so
          # a workflow_dispatch from a branch would reach this tag step with no
          # identity configured and die with "Committer identity unknown".
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force --prune
          if git rev-parse -q --verify "refs/tags/${NV}" >/dev/null; then
            echo "tag ${NV} already exists (race?), reusing"
          else
            # The versionCode rides in the annotation so the next run can read
            # it back even when the sync commit above did not land.
            git tag -a "${NV}" -m "SandboxID ${NV} (code ${NC})"
            git push origin "refs/tags/${NV}"
            echo "tag ${NV} created and pushed"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandboxid-release
          path: dist/*-release.zip
          if-no-files-found: warn

      - name: Upload debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandboxid-debug
          path: dist/*-debug.zip
          if-no-files-found: warn

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: warn

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: SandboxID ${{ steps.version.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*.zip
            dist/checksums.sha256
            update.json
            update.debug.json
            release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lsp-apk:
    # The standalone LSPosed variant. This is the APK a user installs without
    # root. It has never been built before, so this job is also the first
    # compile the variant has ever had — a failure here means a compile error
    # in lsp/, not a packaging regression.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        # The wrapper is intentionally not committed to lsp/ (it would add a
        # binary jar to the tree). This action supplies the Gradle distribution
        # and, unlike a bare `gradle wrapper` invocation, does not require a
        # preinstalled Gradle.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Build release APK
        working-directory: lsp
        run: gradle assembleRelease --no-daemon --warning-mode all

      - name: Sign APK
        # Unsigned APKs cannot be installed. The release keystore is expected
        # as a repository secret; if it is absent the job falls back to a
        # debug key so the artifact is still installable for testing, and says
        # so loudly in the step name output.
        env:
          RELEASE_KEYSTORE: ${{ secrets.LSP_RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.LSP_RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.LSP_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.LSP_KEY_PASS }}
        working-directory: lsp
        run: |
          set -eu
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -f "$APK" ] || APK="app/build/outputs/apk/release/app-release.apk"
          OUT="sandboxid-lsp-${{ github.run_id }}.apk"
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > /tmp/release.keystore
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks /tmp/release.keystore --ks-pass "pass:$RELEASE_KEYSTORE_PASS" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" --key-pass "pass:$RELEASE_KEY_PASS" \
              --out "$OUT" "$APK"
            echo "signed with the release key"
          else
            echo "::warning::LSP_RELEASE_KEYSTORE is not set; signing with a generated debug key. This APK is for testing only."
            keytool -genkeypair -keystore /tmp/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks /tmp/debug.keystore --ks-pass pass:android \
              --ks-key-alias androiddebugkey --key-pass pass:android \
              --v1-signing-enabled true --v2-signing-enabled true \
              --out "$OUT" "$APK"
            echo "signed with a debug key"
          fi
          cp "$OUT" "$RUNNER_TEMP/"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandboxid-lsp-apk
          path: lsp/sandboxid-lsp-*.apk
          if-no-files-found: error

      - name: Attach APK to release
        # The version tag is resolved in the `build` job; this job does not know
        # it. Attach to whatever the newest release is, which is the one this
        # run created.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: lsp
        run: |
          set -eu
          LATEST=$(gh release list --limit 1 | awk '{print $3}' | head -1)
          echo "attaching to release: $LATEST"
          gh release upload "$LATEST" sandboxid-lsp-*.apk --clobber
