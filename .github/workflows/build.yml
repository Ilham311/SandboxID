name: Build Ternak TT

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Ensure jni/zygisk.hpp is present (belt & suspenders)
        run: |
          set -e
          if [ ! -f jni/zygisk.hpp ]; then
            echo "::warning::jni/zygisk.hpp missing from repo, writing inline fallback"
            cat > jni/zygisk.hpp <<'ZYGISK_HPP_EOF'
          // zygisk.hpp - Zygisk C++ SDK subset (CI-generated fallback).
          #pragma once
          #include <jni.h>
          #define ZYGISK_API_VERSION 4
          namespace zygisk {
          struct AppSpecializeArgs {
              jint&        uid;
              jint&        gid;
              jintArray&   gids;
              jint&        runtime_flags;
              jobjectArray& rlimits;
              jint&        mount_external;
              jstring&     se_info;
              jstring&     nice_name;
              jstring&     instruction_set;
              jstring&     app_data_dir;
              jintArray*   fds_to_ignore;
              jboolean*    is_child_zygote;
              jboolean*    is_top_app;
              jobjectArray* pkg_data_info_list;
              jobjectArray* allowlisted_data_info_list;
              jboolean*    mount_data_dirs;
              jboolean*    mount_storage_dirs;
          };
          struct ServerSpecializeArgs {
              jint&        uid;
              jint&        gid;
              jintArray&   gids;
              jint&        runtime_flags;
              jlong&       permitted_capabilities;
              jlong&       effective_capabilities;
          };
          enum Option { FORCE_DENYLIST_UNMOUNT = 0, DLCLOSE_MODULE_LIBRARY = 1 };
          enum StateFlag : uint32_t {
              PROCESS_GRANTED_ROOT   = 1u << 0,
              PROCESS_ON_DENYLIST    = 1u << 1,
          };
          struct Api {
              void setOption(Option opt);
              uint32_t getFlags();
              int connectCompanion();
              int getModuleDir();
              bool pltHookRegister(const char* regex, const char* symbol, void* newFunc, void** oldFunc);
              bool pltHookExclude(const char* regex, const char* symbol);
              bool pltHookCommit();
              int  exemptFd(int fd);
          };
          class ModuleBase {
          public:
              virtual ~ModuleBase() = default;
              virtual void onLoad(Api* api, JNIEnv* env) {}
              virtual void preAppSpecialize(AppSpecializeArgs* args) {}
              virtual void postAppSpecialize(const AppSpecializeArgs* args) {}
              virtual void preServerSpecialize(ServerSpecializeArgs* args) {}
              virtual void postServerSpecialize(const ServerSpecializeArgs* args) {}
          };
          } // namespace zygisk
          extern "C" [[gnu::visibility("default")]] [[gnu::used]]
          void zygisk_module_entry(zygisk::Api* api, JNIEnv* env);
          extern "C" [[gnu::visibility("default")]] [[gnu::used]]
          void zygisk_companion_entry(int client);
          #define REGISTER_ZYGISK_MODULE(clazz) \
              void zygisk_module_entry(zygisk::Api* api, JNIEnv* env) { \
                  static clazz module; \
                  module.onLoad(api, env); \
              }
          #define REGISTER_ZYGISK_COMPANION(func) \
              void zygisk_companion_entry(int client) { func(client); }
          ZYGISK_HPP_EOF
            echo "Wrote fallback jni/zygisk.hpp ($(wc -l < jni/zygisk.hpp) lines)"
          else
            echo "jni/zygisk.hpp already present ($(wc -l < jni/zygisk.hpp) lines) - using repo copy"
          fi

      - name: Build native binaries (all ABIs, release + debug)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          mkdir -p prebuilt
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            for VARIANT in release debug; do
              BDIR="build/${ABI}/${VARIANT}"
              rm -rf "$BDIR" && mkdir -p "$BDIR"
              CMFLAGS="-DANDROID_ABI=${ABI} -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_static"
              if [ "$VARIANT" = "debug" ]; then
                CMFLAGS="$CMFLAGS -DTERNAK_TT_DEBUG=ON"
              fi
              cmake -S jni -B "$BDIR" \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                $CMFLAGS
              cmake --build "$BDIR" --parallel
              mkdir -p "prebuilt/${ABI}"
              SUFFIX=""
              [ "$VARIANT" = "debug" ] && SUFFIX="-debug"
              cp "$BDIR/libternak_tt.so" "prebuilt/${ABI}/libternak_tt${SUFFIX}.so"
              cp "$BDIR/ternak-tt"       "prebuilt/${ABI}/ternak-tt${SUFFIX}"
            done
          done

      - name: Package flashable zips
        run: bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ternak-tt-zips
          path: dist/*.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
