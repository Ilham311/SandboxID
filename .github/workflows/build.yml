name: Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        # v1.0.12: module.prop is the SINGLE source of truth for version.
        # Previous logic seeded from git-describe (defaulted v0.0.0 when no
        # tag existed) and auto-incremented the patch. On this repo without
        # tags it produced v0.0.6 after 6 pushes — overwriting the real
        # v1.0.11 in module.prop and corrupting the log-header version.
        # New behavior: read module.prop; if a matching git tag already
        # exists, bump the patch by 1 so re-runs still produce a new tag;
        # otherwise use module.prop as-is.
        run: |
          PROP_VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          PROP_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          echo "prop_version=$PROP_VERSION (code=$PROP_CODE)"

          if git rev-parse -q --verify "refs/tags/${PROP_VERSION}" >/dev/null; then
              VERSION=${PROP_VERSION#v}
              MAJOR=$(echo $VERSION | cut -d. -f1)
              MINOR=$(echo $VERSION | cut -d. -f2)
              PATCH=$(echo $VERSION | cut -d. -f3)
              [ -z "$PATCH" ] && PATCH=0
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              NEW_CODE="${MAJOR}${MINOR}${NEW_PATCH}"
              echo "tag exists → bumping to $NEW_VERSION"
          else
              NEW_VERSION="$PROP_VERSION"
              NEW_CODE="$PROP_CODE"
              echo "tag not present → using module.prop as-is"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE"       >> $GITHUB_OUTPUT
          echo "📦 Version: $NEW_VERSION (code=$NEW_CODE)"

      - name: Sync module.prop with resolved version
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          NEW_CODE="${{ steps.version.outputs.new_code }}"
          sed -i "s/^version=.*/version=${NEW_VERSION}/"     module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" module.prop
          echo "---- module.prop ----"
          cat module.prop

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Fetch Zygisk header
        run: |
          mkdir -p jni
          curl -fsSL -o jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Placeholder resetprop-rs
        run: |
          mkdir -p prebuilt
          echo "# placeholder" > prebuilt/resetprop-rs.README

      - name: Build (release + debug)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VARIANT: both
        run: |
          chmod +x build.sh
          ./build.sh

      - name: List artifacts
        run: |
          ls -lh dist/

      - name: Generate checksums
        run: |
          mkdir -p dist
          cd dist
          if ls *.zip 1> /dev/null 2>&1; then
            sha256sum *.zip > checksums.sha256
            cat checksums.sha256
          else
            echo "No zip found" > checksums.sha256
          fi

      - name: Create Release Notes
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          {
            echo "## Release $NEW_VERSION"
            echo ""
            echo "**Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Variants"
            echo "- \`ternak-tt-${NEW_VERSION}-release.zip\` — production, LOGD compiled out, stripped binaries"
            echo "- \`ternak-tt-${NEW_VERSION}-debug.zip\` — verbose \`[D]\` logs in \`logcat -s TernakTT:V TernakTTCompanion:V\`, symbols kept"
            echo ""
            echo "### Debug tips"
            echo '```bash'
            echo 'su -c "logcat -c && logcat -v time -s TernakTT:V TernakTTCompanion:V"'
            echo '```'
            echo ""
            echo "### SHA256"
            echo '```text'
            if [ -s dist/checksums.sha256 ]; then
              cat dist/checksums.sha256
            else
              echo "No artifacts generated."
            fi
            echo '```'
          } > release_notes.md

      - name: Upload artifacts (release)
        uses: actions/upload-artifact@v4
        with:
          name: ternak-tt-release
          path: dist/*-release.zip
          if-no-files-found: warn

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: ternak-tt-debug
          path: dist/*-debug.zip
          if-no-files-found: warn

      - name: Create Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          body_path: release_notes.md
          files: |
            dist/*.zip
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
