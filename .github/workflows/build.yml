name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force a specific version (e.g. v1.0.30). Leave blank to auto-bump.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Shell lint (syntax + shellcheck)
        run: |
          set -eu
          echo '----- syntax check (bash -n for bash scripts, sh -n for the rest) -----'
          for f in $(git ls-files '*.sh'); do
            if head -1 "$f" | grep -q bash; then
              bash -n "$f" && echo "bash -n OK : $f"
            else
              sh   -n "$f" && echo "sh -n   OK : $f"
            fi
          done
          echo '----- shellcheck (severity>=warning, honouring each shebang) -----'
          shellcheck --version | head -2
          shellcheck -S warning $(git ls-files '*.sh')
          echo 'shell lint: clean'

      - name: Fetch all tags
        run: |
          git fetch --tags --force --prune
          echo 'existing tags:'
          git tag --sort=-v:refname | head -10

      - name: Resolve version (loop-safe auto-bump)
        id: version
        env:
          
          
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          set -eu
          PROP_VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          PROP_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          FORCE="$FORCE_VERSION"

          
          if [ -n "$FORCE" ] && ! printf '%s' "$FORCE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::force_version '$FORCE' invalid; expected vMAJOR.MINOR.PATCH (mis. v1.0.30)"
            exit 1
          fi

          HIGHEST=$(git tag --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | head -1 || true)
          [ -z "$HIGHEST" ] && HIGHEST="v0.0.0"

          higher() {
            printf '%s\n%s\n' "$1" "$2" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1.2,1n -k2,2n -k3,3n \
              | tail -1
          }

          if [ -n "$FORCE" ]; then
            BASE="$FORCE"
          else
            BASE=$(higher "$PROP_VERSION" "$HIGHEST")
          fi

          NEW_VERSION="$BASE"
          BUMPS=0
          while git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; do
            V=${NEW_VERSION#v}
            MAJ=$(echo "$V" | cut -d. -f1)
            MIN=$(echo "$V" | cut -d. -f2)
            PAT=$(echo "$V" | cut -d. -f3)
            [ -z "$PAT" ] && PAT=0
            NP=$((PAT + 1))
            NEW_VERSION="v${MAJ}.${MIN}.${NP}"
            BUMPS=$((BUMPS + 1))
            if [ "$BUMPS" -gt 500 ]; then
              echo "::error::Bumped >500 times without finding a free tag. Aborting."
              exit 1
            fi
          done

          if [ "$BUMPS" -gt 0 ]; then
            NEW_CODE=$((PROP_CODE + BUMPS))
          else
            NEW_CODE="$PROP_CODE"
          fi

          PREV_TAG=$(git tag --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -v "^${NEW_VERSION}$" \
                    | head -1 || true)

          {
            echo "new_version=${NEW_VERSION}"
            echo "new_code=${NEW_CODE}"
            echo "prev_tag=${PREV_TAG}"
            echo "bumps=${BUMPS}"
          } >> "$GITHUB_OUTPUT"

          echo "----- version resolution -----"
          echo "module.prop   : ${PROP_VERSION} (code=${PROP_CODE})"
          echo "highest tag   : ${HIGHEST}"
          echo "base          : ${BASE}"
          echo "bumps needed  : ${BUMPS}"
          echo "resolved      : ${NEW_VERSION} (code=${NEW_CODE})"
          echo "prev tag      : ${PREV_TAG:-<none>}"

      - name: Sync module.prop
        run: |
          set -eu
          sed -i "s/^version=.*/version=${{ steps.version.outputs.new_version }}/"     module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.version.outputs.new_code }}/" module.prop
          echo '----- module.prop after sync -----'
          cat module.prop

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 
        with:
          ndk-version: r26d

      - name: Build (release + debug)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VARIANT: both
        run: |
          chmod +x build.sh
          ./build.sh

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256

      - name: Generate update.json
        run: |
          set -eu
          NV="${{ steps.version.outputs.new_version }}"
          NC="${{ steps.version.outputs.new_code }}"
          REPO="${{ github.repository }}"

          cat > update.json <<EOF
          {
            "version": "${NV}",
            "versionCode": ${NC},
            "zipUrl": "https://github.com/${REPO}/releases/download/${NV}/sandboxid-${NV}-release.zip",
            "changelog": "https://raw.githubusercontent.com/${REPO}/main/CHANGELOG.md"
          }
          EOF
          echo '----- update.json -----'
          cat update.json

      - name: Generate release_notes.md
        run: |
          set -eu
          NV="${{ steps.version.outputs.new_version }}"
          PREV="${{ steps.version.outputs.prev_tag }}"
          REPO="${{ github.repository }}"

          CL_SECTION=""
          if [ -f CHANGELOG.md ]; then
            
            
            CL_SECTION=$(awk -v ver="${NV}" '
              $0 ~ ("^## " ver "( |$)") { flag = 1; next }
              /^## v/ && flag { exit }
              flag { print }
            ' CHANGELOG.md)
          fi

          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/${PREV}" >/dev/null; then
            COMMITS=$(git log --pretty=format:'- %s (%h)' "${PREV}..HEAD" 2>/dev/null | head -40 || true)
          else
            COMMITS=$(git log --pretty=format:'- %s (%h)' -n 20 HEAD 2>/dev/null || true)
          fi

          {
            echo "# SandboxID ${NV}"
            echo
            echo "**Build:** \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`  "
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${REPO}/commit/${GITHUB_SHA})"
            echo
            if [ -n "$CL_SECTION" ]; then
              echo "## What's new"
              echo
              printf '%s\n' "$CL_SECTION"
              echo
            fi
            echo "## Downloads"
            echo
            echo "| Variant | Purpose |"
            echo "|---------|---------|"
            echo "| \`sandboxid-${NV}-release.zip\` | Production install (stripped, no LOGD) |"
            echo "| \`sandboxid-${NV}-debug.zip\` | Verbose LOGD + on-device auto-log capture |"
            echo
            echo "## Install"
            echo
            echo "1. Download the release zip below"
            echo "2. KernelSU / Magisk manager - Modules - Install from storage"
            echo "3. Reboot, then tap **Action** to rotate persona (auto-locks after)"
            echo
            if [ -n "$COMMITS" ]; then
              if [ -n "$PREV" ]; then
                echo "## Commits since \`${PREV}\`"
              else
                echo "## Recent commits"
              fi
              echo
              printf '%s\n' "$COMMITS"
              echo
            fi
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/checksums.sha256
            echo '```'
          } > release_notes.md

          echo '----- release_notes.md -----'
          cat release_notes.md

      - name: Commit synced module.prop + update.json (rebase-safe)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): sync ${{ steps.version.outputs.new_version }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "push ok (attempt $i)"
              exit 0
            fi
            echo "push attempt $i failed, rebasing..."
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep 3
          done
          echo "::warning::Failed to push module.prop sync after 5 attempts."
          exit 0

      - name: Create tag if missing
        run: |
          set -eu
          NV="${{ steps.version.outputs.new_version }}"
          git fetch --tags --force --prune
          if git rev-parse -q --verify "refs/tags/${NV}" >/dev/null; then
            echo "tag ${NV} already exists (race?), reusing"
          else
            git tag -a "${NV}" -m "SandboxID ${NV}"
            git push origin "refs/tags/${NV}"
            echo "tag ${NV} created and pushed"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 
        with:
          name: sandboxid-release
          path: dist/*-release.zip
          if-no-files-found: warn

      - name: Upload debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 
        with:
          name: sandboxid-debug
          path: dist/*-debug.zip
          if-no-files-found: warn

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: warn

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: SandboxID ${{ steps.version.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*.zip
            dist/checksums.sha256
            update.json
            release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
