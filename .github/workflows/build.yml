name: Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          # Ambil tag terakhir atau mulai dari v0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Parse versi (menghilangkan huruf 'v' jika ada)
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Fallback jika PATCH kosong (misal tag sebelumnya hanya v1.0)
          if [ -z "$PATCH" ]; then PATCH=0; fi
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $LATEST_TAG → $NEW_VERSION"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Fetch Zygisk header
        run: |
          mkdir -p jni
          curl -fsSL -o jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Placeholder resetprop-rs
        run: |
          mkdir -p prebuilt
          echo "# placeholder" > prebuilt/resetprop-rs.README

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate checksums
        run: |
          # Pastikan folder dist ada sebelum masuk
          mkdir -p dist 
          cd dist
          
          # Buat checksum hanya jika ada file zip, untuk menghindari error bash
          if ls *.zip 1> /dev/null 2>&1; then
            sha256sum *.zip > checksums.sha256
          else
            echo "Tidak ada file zip ditemukan" > checksums.sha256
          fi

      - name: Create Release Notes
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          echo "## Release $NEW_VERSION" > release_notes.md
          echo "**Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md
          echo "**Commit:** ${{ github.sha }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Artifacts" >> release_notes.md
          echo "\`\`\`text" >> release_notes.md
          
          # Tulis checksum ke release notes dengan aman
          if [ -s dist/checksums.sha256 ]; then
            cat dist/checksums.sha256 >> release_notes.md
          else
            echo "No artifacts generated." >> release_notes.md
          fi
          
          echo "\`\`\`" >> release_notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ternak-tt-zip
          path: dist/*.zip
          if-no-files-found: warn

      - name: Create Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          body_path: release_notes.md
          files: |
            dist/*.zip
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
